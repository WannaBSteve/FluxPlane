<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="875" viewBox="0 0 1220 875" role="img" aria-labelledby="title desc">
<title id="title">FluxPlane system architecture</title>
<desc id="desc">User requests and external sources enter the service and adapter layers. A durable control plane schedules query and background workers. The system returns query results and status, and publishes versioned datasets and features.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#8da2bb"/></marker></defs>
