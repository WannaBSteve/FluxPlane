<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="562" viewBox="0 0 1220 562" role="img" aria-labelledby="title desc">
<title id="title">FluxPlane multi-source demo</title>
<desc id="desc">Orders from PostgreSQL, products from Parquet, refunds from HTTP, and policy documents feed a versioned business report. After an order and refund update, Accessories net amount changes from 23000 to 27000 cents. An incompatible source schema is rejected while the published result remains readable.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#93a8c2"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="1220" height="562" rx="0" fill="#fff" stroke="#fff"/>
<rect x="24" y="24" width="8" height="43" rx="3" fill="#2563eb" stroke="#2563eb"/>
<text x="48" y="54" font-size="29" fill="#162a44" font-weight="700" text-anchor="start">One report, four source types</text>
<text x="48" y="80" font-size="15" fill="#64768e" font-weight="400" text-anchor="start">A live report from databases, files, APIs, and documents</text>
<rect x="24" y="113" width="274" height="330" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
<text x="44" y="142" font-size="11" fill="#5d7290" font-weight="700" text-anchor="start">INPUTS</text>
<rect x="44" y="160" width="234" height="53" rx="8" fill="#fff" stroke="#e0e7f0"/>
<text x="58" y="183" font-size="14" fill="#24364f" font-weight="650" text-anchor="start">PostgreSQL</text>
<text x="58" y="202" font-size="11" fill="#64768e" font-weight="400" text-anchor="start">Orders and customers</text>
<rect x="44" y="225" width="234" height="53" rx="8" fill="#fff" stroke="#e0e7f0"/>
<text x="58" y="248" font-size="14" fill="#24364f" font-weight="650" text-anchor="start">Parquet</text>
<text x="58" y="267" font-size="11" fill="#64768e" font-weight="400" text-anchor="start">Product categories</text>
<rect x="44" y="290" width="234" height="53" rx="8" fill="#fff" stroke="#e0e7f0"/>
<text x="58" y="313" font-size="14" fill="#24364f" font-weight="650" text-anchor="start">HTTP JSON</text>
<text x="58" y="332" font-size="11" fill="#64768e" font-weight="400" text-anchor="start">Refund records</text>
<rect x="44" y="355" width="234" height="53" rx="8" fill="#fff" stroke="#e0e7f0"/>
<text x="58" y="378" font-size="14" fill="#24364f" font-weight="650" text-anchor="start">Markdown / PDF</text>
<text x="58" y="397" font-size="11" fill="#64768e" font-weight="400" text-anchor="start">Return policy and FAQ</text>
<path d="M299 277 L326 277" fill="none" stroke="#93a8c2" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330" y="113" width="448" height="330" rx="12" fill="#edf4ff" stroke="#b6cef3"/>
<text x="350" y="142" font-size="11" fill="#42689e" font-weight="700" text-anchor="start">FLUXPLANE</text>
<rect x="350" y="163" width="408" height="65" rx="8" fill="#fff" stroke="#c7d9f6"/>
<rect x="365" y="178" width="31" height="31" rx="8" fill="#dceafe" stroke="#c7d9f6"/>
<text x="380.5" y="199" font-size="14" fill="#2457a8" font-weight="700" text-anchor="middle">1</text>
<text x="410" y="190" font-size="14" fill="#24364f" font-weight="650" text-anchor="start">Create versioned snapshots</text>
<text x="410" y="210" font-size="11" fill="#64768e" font-weight="400" text-anchor="start">Each source enters a common data catalog</text>
<rect x="350" y="242" width="408" height="65" rx="8" fill="#fff" stroke="#c7d9f6"/>
<rect x="365" y="257" width="31" height="31" rx="8" fill="#dceafe" stroke="#c7d9f6"/>
<text x="380.5" y="278" font-size="14" fill="#2457a8" font-weight="700" text-anchor="middle">2</text>
<text x="410" y="269" font-size="14" fill="#24364f" font-weight="650" text-anchor="start">Refresh affected features</text>
<text x="410" y="289" font-size="11" fill="#64768e" font-weight="400" text-anchor="start">Dependencies select the work to run</text>
<rect x="350" y="321" width="408" height="65" rx="8" fill="#fff" stroke="#c7d9f6"/>
<rect x="365" y="336" width="31" height="31" rx="8" fill="#dceafe" stroke="#c7d9f6"/>
<text x="380.5" y="357" font-size="14" fill="#2457a8" font-weight="700" text-anchor="middle">3</text>
<text x="410" y="348" font-size="14" fill="#24364f" font-weight="650" text-anchor="start">Publish a consistent release</text>
<text x="410" y="368" font-size="11" fill="#64768e" font-weight="400" text-anchor="start">Queries bind to one set of input versions</text>
<path d="M779 277 L806 277" fill="none" stroke="#93a8c2" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810" y="113" width="386" height="330" rx="12" fill="#f8fafc" stroke="#dbe4ef"/>
<text x="830" y="142" font-size="11" fill="#5d7290" font-weight="700" text-anchor="start">VISIBLE RESULT</text>
<text x="830" y="174" font-size="19" fill="#162a44" font-weight="700" text-anchor="start">Revenue after refunds</text>
<text x="830" y="201" font-size="11" fill="#64768e" font-weight="600" text-anchor="start">Category</text>
<text x="1040" y="201" font-size="11" fill="#64768e" font-weight="600" text-anchor="end">Before</text>
<text x="1172" y="201" font-size="11" fill="#64768e" font-weight="600" text-anchor="end">After</text>
<path d="M830 212 L1176 212" fill="none" stroke="#d6e0ed" stroke-width="1"/>
<text x="830" y="246" font-size="14" fill="#24364f" font-weight="600" text-anchor="start">Accessories</text>
<text x="1040" y="246" font-size="14" fill="#24364f" font-weight="600" text-anchor="end">23,000</text>
<text x="1172" y="246" font-size="14" fill="#1a8b70" font-weight="700" text-anchor="end">27,000</text>
<path d="M830 259 L1176 259" fill="none" stroke="#e5ebf3" stroke-width="1"/>
<text x="830" y="300" font-size="14" fill="#24364f" font-weight="600" text-anchor="start">Displays</text>
<text x="1040" y="300" font-size="14" fill="#24364f" font-weight="600" text-anchor="end">16,000</text>
<text x="1172" y="300" font-size="14" fill="#24364f" font-weight="700" text-anchor="end">16,000</text>
<path d="M830 313 L1176 313" fill="none" stroke="#e5ebf3" stroke-width="1"/>
<text x="830" y="354" font-size="11" fill="#64768e" font-weight="400" text-anchor="start">Net amount in cents</text>
<rect x="830" y="375" width="346" height="43" rx="8" fill="#eff9f7" stroke="#c5e6dc"/>
<text x="845" y="402" font-size="12" fill="#277565" font-weight="600" text-anchor="start">2 policy references linked to the report</text>
<rect x="24" y="467" width="1172" height="78" rx="12" fill="#f4f7fb" stroke="#dbe4ef"/>
<text x="44" y="494" font-size="11" fill="#5d7290" font-weight="700" text-anchor="start">THE ONLINE CHANGE</text>
<text x="44" y="520" font-size="13" fill="#24364f" font-weight="600" text-anchor="start">Seed release</text>
<path d="M156 515 L185 515" fill="none" stroke="#93a8c2" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="197" y="520" font-size="13" fill="#24364f" font-weight="600" text-anchor="start">Orders + refunds update</text>
<path d="M389 515 L418 515" fill="none" stroke="#93a8c2" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430" y="520" font-size="13" fill="#24364f" font-weight="600" text-anchor="start">New release and refreshed report</text>
<path d="M704 515 L733 515" fill="none" stroke="#93a8c2" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="745" y="520" font-size="13" fill="#24364f" font-weight="600" text-anchor="start">Bad schema rejected; report stays readable</text>
</g></svg>
