    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3979ff"/><stop offset="1" stop-color="#1745bd"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#829bc1" opacity="0.16"/></pattern>
    <filter id="shadow" x="-25%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#233f74" flood-opacity="0.09"/></filter>
