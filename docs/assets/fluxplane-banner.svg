<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">FluxPlane. Data in motion. Analysis in sync.</title>
  <desc id="desc">Multimodal feature fusion across structured data and document text. Database, file and API sources feed maintained features and versioned analytics.</desc>
  <defs>
