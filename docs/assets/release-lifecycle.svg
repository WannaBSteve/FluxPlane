<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="536" viewBox="0 0 1280 536" role="img" aria-labelledby="title desc">
<title id="title">FluxPlane release lifecycle</title><desc id="desc">An illustrative single-dataset update invalidates dependent features in the new release. Refresh publishes a matching feature snapshot. Existing queries keep their pinned release; new queries cannot silently mix stale features with new data.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#9bb3ce" opacity="0.22"/></pattern><filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#28476f" flood-opacity="0.07"/></filter></defs>
<g font-family="Trebuchet MS, DejaVu Sans, sans-serif">
<rect x="1" y="1" width="1278" height="534" rx="20" fill="#f8faff" stroke="#d7e2ef"/>
<rect x="20" y="100" width="1240" height="416" fill="url(#dots)"/>
<text x="32" y="31" font-size="11" fill="#3266da" font-weight="700" text-anchor="start">FLUXPLANE / VERSIONED EXECUTION</text>
<text x="32" y="65" font-size="28" fill="#193454" font-weight="700" text-anchor="start">Data changes. Query inputs stay explicit.</text>
<text x="32" y="89" font-size="13" fill="#59718e" font-weight="400" text-anchor="start">Illustrative version labels for one dataset and one dependent feature.</text>
<rect x="32" y="128" width="268" height="178" rx="12" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/>
<text x="50" y="155" font-size="10" fill="#3266da" font-weight="700" text-anchor="start">01 / QUERY SUBMITTED</text>
<g transform="translate(50 172) scale(1)" fill="none" stroke="#3266da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 9-5 9 5-9 5Zm0 5 9 5 9-5M3 17l9 5 9-5"/></g>
<text x="87" y="193" font-size="19" fill="#193454" font-weight="700" text-anchor="start">Release R0</text>
<rect x="50" y="211" width="232" height="36" rx="7" fill="#f3f6fb" stroke="#e1e8f1"/>
<text x="62" y="235" font-size="14" fill="#3266da" font-weight="700" text-anchor="start">D1 + F1</text>
<text x="50" y="281" font-size="11" fill="#59718e" font-weight="400" text-anchor="start">Q-old pins this version</text>
<path d="M300 216H343" fill="none" stroke="#59718e" stroke-width="2" stroke-linejoin="round"/>
<path d="M337 212L343 216L337 220" fill="none" stroke="#59718e" stroke-width="2" stroke-linejoin="round"/>
<rect x="348" y="128" width="268" height="178" rx="12" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/>
<text x="366" y="155" font-size="10" fill="#a87324" font-weight="700" text-anchor="start">02 / SOURCE UPDATED</text>
<g transform="translate(366 172) scale(1)" fill="none" stroke="#a87324" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 9-5 9 5-9 5Zm0 5 9 5 9-5M3 17l9 5 9-5"/></g>
<text x="403" y="193" font-size="19" fill="#193454" font-weight="700" text-anchor="start">Release R1</text>
<rect x="366" y="211" width="232" height="36" rx="7" fill="#f3f6fb" stroke="#e1e8f1"/>
<text x="378" y="235" font-size="14" fill="#a87324" font-weight="700" text-anchor="start">D2 / feature pending</text>
<text x="366" y="281" font-size="11" fill="#59718e" font-weight="400" text-anchor="start">Dependent refresh queued</text>
<path d="M616 216H659" fill="none" stroke="#59718e" stroke-width="2" stroke-linejoin="round"/>
<path d="M653 212L659 216L653 220" fill="none" stroke="#59718e" stroke-width="2" stroke-linejoin="round"/>
<rect x="664" y="128" width="268" height="178" rx="12" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/>
<text x="682" y="155" font-size="10" fill="#178675" font-weight="700" text-anchor="start">03 / FEATURE REFRESHED</text>
<g transform="translate(682 172) scale(1)" fill="none" stroke="#178675" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 9-5 9 5-9 5Zm0 5 9 5 9-5M3 17l9 5 9-5"/></g>
<text x="719" y="193" font-size="19" fill="#193454" font-weight="700" text-anchor="start">Release R2</text>
<rect x="682" y="211" width="232" height="36" rx="7" fill="#f3f6fb" stroke="#e1e8f1"/>
<text x="694" y="235" font-size="14" fill="#178675" font-weight="700" text-anchor="start">D2 + F2</text>
<text x="682" y="281" font-size="11" fill="#59718e" font-weight="400" text-anchor="start">Inputs checked at publication</text>
<path d="M932 216H975" fill="none" stroke="#59718e" stroke-width="2" stroke-linejoin="round"/>
<path d="M969 212L975 216L969 220" fill="none" stroke="#59718e" stroke-width="2" stroke-linejoin="round"/>
<rect x="980" y="128" width="268" height="178" rx="12" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/>
<text x="998" y="155" font-size="10" fill="#3266da" font-weight="700" text-anchor="start">04 / NEW QUERY</text>
<g transform="translate(998 172) scale(1)" fill="none" stroke="#3266da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5-6 7 6 7m8-14 6 7-6 7m-3-16-2 18"/></g>
<text x="1035" y="193" font-size="19" fill="#193454" font-weight="700" text-anchor="start">Q-new reads R2</text>
<rect x="998" y="211" width="232" height="36" rx="7" fill="#f3f6fb" stroke="#e1e8f1"/>
<text x="1010" y="235" font-size="14" fill="#3266da" font-weight="700" text-anchor="start">D2 + F2</text>
<text x="998" y="281" font-size="11" fill="#59718e" font-weight="400" text-anchor="start">Matching published inputs</text>
<rect x="348" y="326" width="584" height="52" rx="12" fill="#fff8ed" stroke="#ead7b4"/>
<g transform="translate(365 340) scale(1)" fill="none" stroke="#a87324" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></g>
<text x="401" y="348" font-size="12" fill="#866026" font-weight="700" text-anchor="start">A pending feature is not substituted with its old snapshot.</text>
<text x="401" y="367" font-size="11" fill="#866026" font-weight="400" text-anchor="start">New queries requiring it receive an explicit stale-feature error.</text>
<path d="M482 306V326" fill="none" stroke="#a87324" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 5"/>
<rect x="32" y="405" width="1216" height="86" rx="12" fill="#edf3ff" stroke="#c2d3f1"/>
<g transform="translate(51 429) scale(1)" fill="none" stroke="#3266da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5-6 7 6 7m8-14 6 7-6 7m-3-16-2 18"/></g>
<text x="88" y="439" font-size="16" fill="#3266da" font-weight="700" text-anchor="start">Q-old continues on R0</text>
<text x="88" y="466" font-size="12" fill="#59718e" font-weight="400" text-anchor="start">Its submitted input versions remain D1 + F1.</text>
<path d="M453 448H955" fill="none" stroke="#3266da" stroke-width="2" stroke-linejoin="round"/>
<path d="M949 444L955 448L949 452" fill="none" stroke="#3266da" stroke-width="2" stroke-linejoin="round"/>
<rect x="979" y="425" width="248" height="45" rx="9" fill="#fff" stroke="#c2d3f1"/>
<text x="1103" y="454" font-size="11" fill="#3266da" font-weight="700" text-anchor="middle">Result from the pinned release</text>
<path d="M164 306V405" fill="none" stroke="#3266da" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 5"/>
<text x="32" y="519" font-size="11" fill="#59718e" font-weight="400" text-anchor="start">D = dataset snapshot    F = feature snapshot    R = published release</text>
</g></svg>
