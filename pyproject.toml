[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxplane"
version = "0.1.0"
description = "Multi-source data and feature management platform"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "duckdb>=1.3,<2",
  "pyarrow>=19,<25",
  "sqlglot>=26,<30",
  "httpx>=0.28,<1",
  "PyMuPDF>=1.25,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
fluxplane = "fluxplane.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
"fluxplane.migrations" = ["script.py.mako"]
"fluxplane.migrations.versions" = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

